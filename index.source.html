    <script>
      // 1. Détection ouverture locale file:// (double-clic direct sur PC)

        window.addEventListener('DOMContentLoaded', () => {
          document.body.innerHTML = `
            <div style="font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #090d16; color: white; padding: 20px; text-align: center;">
              <div style="max-width: 520px; background: #131c2e; padding: 32px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7); border: 1px solid #1e293b;">
                <div style="font-size: 56px; margin-bottom: 16px;">🌐</div>
                <h2 style="font-size: 22px; font-weight: 800; margin-bottom: 12px; color: #f8fafc;">Ouverture sur Ordinateur</h2>
                <p style="font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px;">
                  Les navigateurs bloquent l'exécution directe en double-cliquant sur un fichier local pour des raisons de sécurité. Pour ouvrir votre boutique avec la synchronisation Cloud :

                <a href="https://ibrahimdiallogorom-design.github.io/gestion-stock/" style="display: inline-block; background: #2563eb; color: white; padding: 14px 28px; border-radius: 14px; font-weight: 700; text-decoration: none; font-size: 15px; box-shadow: 0 10px 20px -5px rgba(37,99,235,0.4);">

    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root"></div>
    <script>
      // Enregistrement du Service Worker pour fonctionnement 100% Hors-Ligne
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((registration) => {
            if (navigator.onLine) {
              registration.update().catch(() => {});
            }
          }).catch((err) => {
            console.warn('Service worker registration failed:', err);
          });

          navigator.serviceWorker.addEventListener('message', (event) => {
            if (event.data && event.data.action === 'RELOAD_NOW') {
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
